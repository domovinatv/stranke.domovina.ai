[project]
name = "hrvatske-politicke-stranke"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.0",
    "pillow>=12.3.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# anyio's pytest plugin (via fastapi/httpx) still imports the renamed CallSpec2.
filterwarnings = ["ignore:_pytest.python.CallSpec2 has been renamed:pytest.PytestRemovedIn10Warning"]
