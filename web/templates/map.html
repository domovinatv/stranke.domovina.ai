{% extends "base.html" %}
{% block title %}Karta stranaka · DOMOVINA Stranke{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<div class="flex items-center justify-between gap-3 flex-wrap mb-3">
  <div>
    <h1 class="text-xl font-bold">Karta stranaka</h1>
    <p class="text-sm text-slate-500">
      <span class="font-medium">{{ geo_count }}</span> stranaka lociranih
      od <span class="font-medium">{{ total }}</span>
      {% if total > 0 %}({{ "%.0f"|format(100 * geo_count / total) }}%){% endif %}
    </p>
  </div>
  <div class="text-xs text-slate-500">
    <span class="inline-flex items-center gap-1 mr-2"><span class="w-3 h-3 rounded-full bg-emerald-500 border border-white shadow"></span> Aktivna</span>
    <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-400 border border-white shadow"></span> Prestanak</span>
  </div>
</div>

<div id="map" class="rounded-lg border border-slate-200" style="height: 78vh;"></div>

<script>
const STATUS_COLORS = {
  'AKTIVAN': '#10b981',
  'PRESTANAK': '#94a3b8',
};

const parties = {{ parties_json|safe }};

const map = L.map('map', { preferCanvas: true }).setView([45.1, 16.5], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

const cluster = L.markerClusterGroup({ chunkedLoading: true });

for (const p of parties) {
  const color = STATUS_COLORS[p.status] || '#94a3b8';
  const m = L.circleMarker([p.lat, p.lng], {
    radius: p.status === 'AKTIVAN' ? 8 : 6,
    color: '#fff',
    weight: 1.5,
    fillColor: color,
    fillOpacity: 0.95,
  });
  const popup = `
    <div style="min-width:180px">
      <div style="font-weight:600;font-size:14px;margin-bottom:4px">
        <a href="/stranke/${p.slug}" style="color:#c8102e">${p.canonical_name}</a>
      </div>
      <div style="font-size:11px;color:#64748b;margin-bottom:6px">
        ${p.city ? p.city : ''}${p.city && p.short_name ? ' · ' : ''}${p.short_name ? p.short_name : ''}
        ${p.status ? ' · ' + p.status : ''}
      </div>
      ${p.phone ? `<div style="font-size:11px">📞 ${p.phone}</div>` : ''}
      ${p.email ? `<div style="font-size:11px">✉ ${p.email}</div>` : ''}
    </div>`;
  m.bindPopup(popup);
  cluster.addLayer(m);
}
map.addLayer(cluster);

// Fit map to all markers if any
if (parties.length > 0) {
  const bounds = L.latLngBounds(parties.map(p => [p.lat, p.lng]));
  map.fitBounds(bounds, { padding: [20, 20] });
}
</script>
{% endblock %}
